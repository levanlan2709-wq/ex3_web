<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="container">
        <h1>Sửa User</h1>
        <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
            <input type="hidden" th:field="*{id}">
            <label>Username<input th:field="*{username}"></label><label>Email<input th:field="*{email}"></label>
            <label>Fullname<input th:field="*{fullName}"></label>
            <label>Role<select th:field="*{roleId}">
                    <option th:each="r:${roles}" th:value="${r.id}" th:text="${r.name}"></option>
                </select></label>
            <label><input type="checkbox" th:field="*{enabled}"> Enabled</label><button>Lưu</button>
        </form>
    </main>
</body>

</html>
