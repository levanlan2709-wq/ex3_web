<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
    <header th:fragment="header" class="header">
        <a th:href="@{/}" class="brand">Example 3</a>
        <nav>
            <a th:href="@{/}">Dashboard</a>
            <a th:href="@{/products}">Sản phẩm của tôi</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Quản lý User</a>
        </nav>
        <div sec:authorize="isAuthenticated()" class="account">
            <img th:if="${#authentication.principal.images != null}" th:src="${#authentication.principal.images}"
                alt="avatar">
            <span th:text="${#authentication.principal.fullName}">Full name</span>
            <span th:text="${#authentication.principal.username}">username</span>
            <form th:action="@{/logout}" method="post"><button>Đăng xuất</button></form>
        </div>
    </header>
</body>

</html>
