<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
    <main class="auth">
        <h1>Đăng ký</h1>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/register}" th:object="${registerDTO}" method="post">
            <label>Username<input th:field="*{username}" required></label>
            <label>Email<input type="email" th:field="*{email}" required></label>
            <label>Họ tên<input th:field="*{fullName}" required></label>
            <label>Mật khẩu<input type="password" th:field="*{password}" required></label>
            <button>Gửi OTP đăng ký</button>
        </form><a th:href="@{/login}">Quay lại đăng nhập</a>
    </main>
</body>

</html>
