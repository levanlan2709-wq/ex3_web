<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Product</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><main class="container">
<h1 th:text="${product.id == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}"></h1>
<form th:action="@{/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
<input type="hidden" th:field="*{id}">
<label>Tên<input th:field="*{name}" required></label>
<label>Giá<input type="number" step="0.01" th:field="*{price}" required></label>
<label>Số lượng<input type="number" th:field="*{quantity}" required></label>
<label>Mô tả<textarea th:field="*{description}"></textarea></label>
<label>Ảnh Cloudinary<input type="file" name="image" accept="image/*"></label>
<img class="preview" th:if="${product.images}" th:src="${product.images}">
<button>Lưu</button></form></main></body></html>
