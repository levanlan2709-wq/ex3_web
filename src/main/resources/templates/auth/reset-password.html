<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mật khẩu mới</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
    <main class="auth">
        <h1>Đặt mật khẩu mới</h1>
        <form th:action="@{/reset-password}" method="post">
            <label>Mật khẩu mới<input type="password" name="password" minlength="6" required></label><button>Đổi mật
                khẩu</button>
        </form>
    </main>
</body>

</html>
